# OneClassMesh agent config example.
# Copy to conf/config.toml and fill in real values (config.toml is git-ignored).

[device]
school_code = "REPLACE_ME"
sn = "REPLACE_ME"
device_secret = "REPLACE_ME"
mqtt_token = "REPLACE_ME"

[broker]
host = "REPLACE_ME"
port = 1883

[agent]
heartbeat_seconds = 60
log_level = "info"
# ipc_token is optional; defaults to "ocm-" + mqtt_token
ipc_token = ""
