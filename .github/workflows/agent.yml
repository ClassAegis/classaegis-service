# SPDX-License-Identifier: AGPL-3.0-only
name: classaegis-service-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-go:
    name: ClassAegisService runtime (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { $env:GITHUB_SHA.Substring(0,8) }
          New-Item -ItemType Directory -Force out\bin, out\conf | Out-Null
          $targets = @(
            @{ Name = 'ClassAegisCore.exe'; Package = './cmd/core' },
            @{ Name = 'ClassAegisAbility.exe'; Package = './cmd/ability' },
            @{ Name = 'ClassAegisCtl.exe'; Package = './cmd/ocmctl' },
            @{ Name = 'ClassAegisDebug.exe'; Package = './cmd/agent' }
          )
          foreach ($t in $targets) {
            go build -trimpath -ldflags "-s -w" -o "out\bin\$($t.Name)" $t.Package
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # GUI subsystem: double-click / boot autostart must not pop a console window.
          go build -trimpath -ldflags "-s -w -H windowsgui" -o out\bin\ClassAegisLauncher.exe ./cmd/launcher
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Copy-Item conf/config.example.toml out/conf/
          Compress-Archive -Path out\bin, out\conf -DestinationPath "out\ClassAegisService-win64-$v.zip" -Force
          Write-Host "version=$v"

      - uses: actions/upload-artifact@v4
        with:
          name: go-bin
          path: out/

  package-ui:
    name: NSIS installer
    needs: build-go
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cmd/ui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Pin version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v','' } else { (Get-Content cmd/ui/package.json | ConvertFrom-Json).version }
          Set-Location cmd/ui
          npm version $v --no-git-tag-version --allow-same-version
          Write-Host "version=$v"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build ClassAegisService Tauri installer
        working-directory: cmd/ui
        run: |
          npm ci --no-audit --no-fund
          npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: cmd/ui/src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-go, package-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: go-bin
          path: go-bin

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease";; esac
          VER="${GITHUB_REF_NAME#v}"
          cat > notes.md <<'EOF'
          课佑管家 ClassAegisService

          - ClassAegisService_*_x64-setup.exe : Tauri NSIS 安装包(显示应用 + Core/Ability/Launcher 运行时)
          - ClassAegisService-win64-*.zip : 绿色版(5 个 exe + config.example.toml)

          安装说明:
          1. 双击 setup.exe 并按默认 NSIS 安装向导安装
          2. 在安装目录的 conf\config.toml 中填写配置(可从 config.example.toml 复制,REPLACE_ME 需替换为真实配置)
          3. 桌面快捷方式「课佑管家」启动:ClassAegisLauncher 守护 ClassAegisCore/ClassAegisAbility 并打开 ClassAegisService
          EOF
          gh release create "$GITHUB_REF_NAME" go-bin/*.zip installer/*.exe \
            --title "课佑管家 $VER" --notes-file notes.md $PRERELEASE
